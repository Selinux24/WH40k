# Army List Scenarios
scenarios:
  max_output:
    name: "Maximum Offensive Output"
    description: "Units designed for high damage output with minimal survivability."
    units:
      - unit_id: 'psyker-assault'
        name: "Psyker Assault Squad"
        faction: "Chaos Space Marines"
        model_type: "Infantry"
        wargear_capacity: 4
      - unit_id: 'heavy-weapon'
        name: "Plasma Cannon Trooper"
        faction: "Imperial Guard"
        model_type: "Infantry"
        wargear_capacity: 2
    weapons:
      - weapon_id: 'plasma-cannon'
        name: "Overcharged Plasma Cannon"
        damage_base: 5.0
        range_type: "Long"
        ammo_requirement: 1
        synergy_tags: "anti-armor, high-yield"
    abilities:
      - ability_id: 'overcharge'
        name: "Overcharge Power"
        description: "Increases damage by 1 point if the unit survives the first round."
        effect_type: "Buff"
        prerequisite_unit_id: "psyker-assault"

  min_survivability:
    name: "Minimal Survivability Skirmishers"
    description: "Units relying on speed and hit-and-run tactics, low toughness."
    units:
      - unit_id: 'swift-scout'
        name: "Swift Scout Drone"
        faction: "Aeldari"
        model_type: "Scout"
        wargear_capacity: 1
    weapons:
      - weapon_id: 'shock-bolt'
        name: "Shock Bolt Rifle"
        damage_base: 2.0
        range_type: "Short"
        ammo_requirement: 0
        synergy_tags: "anti-scout"
    abilities: []

  balanced_force:
    name: "Balanced Battle Line"
    description: "A mix of durable frontline units and tactical support."
    units:
      - unit_id: 'veteran-guard'
        name: "Veteran Guard Unit"
        faction: "Imperial Guard"
        model_type: "Infantry"
        wargear_capacity: 3
      - unit_id: 'support-psyker'
        name: "Support Psyker"
        faction: "Chaos Space Marines"
        model_type: "Character"
        wargear_capacity: 1
    weapons:
      - weapon_id: 'lasgun'
        name: "Standard Lasgun"
        damage_base: 3.0
        range_type: "Long"
        ammo_requirement: 0
        synergy_tags: ""
    abilities: []
